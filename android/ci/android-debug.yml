# Recipe only until committed as .github/workflows/android-debug.yml.
name: Android debug APK
on:
  push:
    branches: [android/test-apk-20260909]
    paths:
      - 'android/**'
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install exact SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK and run Android lint
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK contents and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          sha256sum "$APK" > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'APK compiled, archive checked, and signature verified. Device runtime is not yet tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Future-Jarvis-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-diagnostics
          path: android/app/build/reports/
          if-no-files-found: warn
